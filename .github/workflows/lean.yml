name: lean
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: README inventory of Lean files
        run: sh scripts/check_inventory.sh
      - name: Install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o elan-init.sh
          sh elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Build
        run: lake build
      - name: Forbidden constructs
        run: |
          if grep -rnE '\bsorry\b|\badmit\b|native_decide|^\s*axiom ' formal word-ir forth bcpl wolfram backend --include='*.lean'; then exit 1; fi
      - name: Axiom audit
        run: lake env lean formal/Audit.lean
      - name: Native x86-64 execution check
        run: .lake/build/bin/wordc check 300
      - name: Forth source files (x86-64)
        run: for f in examples/forth/*.fs; do .lake/build/bin/wordc forth "$f" || exit 1; done
      - name: Install wasmtime
        run: |
          curl -sSfL -o wasmtime.tar.xz https://github.com/bytecodealliance/wasmtime/releases/download/v30.0.2/wasmtime-v30.0.2-x86_64-linux.tar.xz
          tar xf wasmtime.tar.xz
          echo "$PWD/wasmtime-v30.0.2-x86_64-linux" >> "$GITHUB_PATH"
      - name: WebAssembly execution check
        run: .lake/build/bin/wasmw check 300
      - name: Forth source files (WebAssembly)
        run: for f in examples/forth/*.fs; do .lake/build/bin/wasmw forth "$f" || exit 1; done
      - name: Install AArch64/RISC-V toolchain and emulators
        run: sudo apt-get update && sudo apt-get install -y clang lld qemu-user
      - name: AArch64 execution check (qemu)
        run: .lake/build/bin/a64c check 300
      - name: Forth source files (AArch64)
        run: for f in examples/forth/*.fs; do .lake/build/bin/a64c forth "$f" || exit 1; done
      - name: RISC-V execution check (qemu)
        run: .lake/build/bin/rv64c check 300
      - name: Forth source files (RISC-V)
        run: for f in examples/forth/*.fs; do .lake/build/bin/rv64c forth "$f" || exit 1; done
