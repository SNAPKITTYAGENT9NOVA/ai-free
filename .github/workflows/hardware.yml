name: hardware
# Runs every Forth example on real boards attached to a self-hosted runner (docs/HIL.md) and
# checks each board's serial transcript against the Lean semantics. A self-hosted runner must
# never run code from pull requests, so it never runs on them.
#
# For now it runs only when started from the Actions tab, so pushes do not queue a job that no
# machine can take. Once the rig is registered (docs/HIL.md, step 5), add
#   push:
#     branches: [master]
# under `on:` to check every change to master on the boards.
on:
  workflow_dispatch:
jobs:
  samd21:
    runs-on: [self-hosted, linux, samd21]
    env:
      HIL_TTY: ${{ vars.SAMD21_TTY }}
      HIL_ADAPTER_SERIAL: ${{ vars.SAMD21_ADAPTER_SERIAL }}
    steps:
      - uses: actions/checkout@v4
      - name: Make lake available
        run: |
          if [ ! -x "$HOME/.elan/bin/lake" ]; then
            curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o elan-init.sh
            sh elan-init.sh -y --default-toolchain none
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Build cm0c
        run: lake build cm0c
      - name: Every example on the SAM D21 Curiosity Nano
        run: |
          [ -n "$HIL_TTY" ] || { echo "set the repository variable SAMD21_TTY (docs/HIL.md)"; exit 1; }
          scripts/hil/run-all.sh samd21-cnano "$HIL_TTY"
